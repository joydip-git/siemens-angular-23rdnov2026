<h2>
    List of Products
</h2>
<br>
<div>
    <span>
        Filtering Products By: {{filterText()}}
    </span>
</div>
<br>
@if(products().length>0){
<table>
    <thead>
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Rating</th>
            <th>Delete</th>
        </tr>
    </thead>
    <tbody id="proTableBody">
        @for (p of products()|productFilter:filterText(); track $index) {
        <tr>
            <td>
                <img [src]="p.imageUrl" alt="NA" class="img-box" [title]="p.productName"
                    [routerLink]="['/products/view',p.productId]">
            </td>
            <td>{{p.productName|uppercase}}</td>
            <td>{{p.price|currency:'INR'}}</td>
            <td>{{p.starRating}}</td>
            <td>
                <button type="button">Delete</button>
            </td>
        </tr>
        }
    </tbody>
</table>
}@else {
<span>No Product Records</span>
}
