@if(!isRequestOver()){
<span>Loading....</span>
}@else if (errorInfo()!=='') {
<span>{{errorInfo()}}</span>
}@else if(posts().length===0){
<span>No posts found</span>
}@else {
<ul>
    @for (post of posts(); track $index) {
    <li (click)="selectedPostId.set(post.id)">
        <u>
            {{post.title}}
        </u>
    </li>
    }
</ul>
}

@if(selectedPostId()>0){
    <app-post-details [postId]="selectedPostId()"></app-post-details>
}
